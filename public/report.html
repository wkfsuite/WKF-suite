<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Permessi - Gestione Permessi</title>
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F5C842">

  <!-- iOS Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WKF Suite">
  <link rel="apple-touch-icon" href="/icons/icon-180x180.png">

  <!-- Android/Chrome Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="WKF Suite">

  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.2/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="toast.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <img src="logo.png" alt="Logo" id="logoImage">
        <span>Report Permessi</span>
      </div>
      <div class="actions">
        <button class="btn" onclick="generatePDF()">📊 Scarica PDF Report</button>
        <button class="btn secondary" onclick="window.location.href='dashboard.html'">← Dashboard</button>
      </div>
    </div>

    <!-- Filtri Report -->
    <div class="card">
      <h3>Filtri Report</h3>
      <div class="grid">
        <div class="col-4">
          <label>Dal:</label>
          <input type="date" id="filtroDataDal" class="input">
        </div>
        <div class="col-4">
          <label>Al:</label>
          <input type="date" id="filtroDataAl" class="input">
        </div>
        <div class="col-4">
          <label>Dipendente:</label>
          <select id="filtroDipendente" class="input">
            <option value="">Tutti i dipendenti</option>
          </select>
        </div>
      </div>
      <button class="btn" onclick="aggiornaReport()" style="margin-top: 15px;">🔄 Aggiorna Report</button>
    </div>

    <!-- Statistiche Generali -->
    <div class="grid">
      <div class="col-6">
        <div class="card">
          <h4>📈 Statistiche Generali</h4>
          <div id="statisticheGenerali">
            <div class="stat-item">
              <span class="stat-label">Totale Richieste:</span>
              <span class="stat-value" id="totaleRichieste">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Approvate:</span>
              <span class="stat-value stat-success" id="richiesteApprovate">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Rifiutate:</span>
              <span class="stat-value stat-error" id="richiesteRifiutate">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">In Attesa:</span>
              <span class="stat-value stat-warning" id="richiesteInAttesa">0</span>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6">
        <div class="card">
          <h4>📊 Distribuzione Stati</h4>
          <canvas id="graficoStati" width="400" height="300"></canvas>
        </div>
      </div>
    </div>

    <!-- Grafici Dettagliati -->
    <div class="grid">
      <div class="col-6">
        <div class="card">
          <h4>📅 Permessi per Mese</h4>
          <canvas id="graficoMensile" width="400" height="300"></canvas>
        </div>
      </div>
      <div class="col-6">
        <div class="card">
          <h4>🏷️ Tipologie Permessi</h4>
          <canvas id="graficoTipi" width="400" height="300"></canvas>
        </div>
      </div>
    </div>

    <!-- Tabella Dettaglio -->
    <div class="card">
      <h4>📋 Dettaglio Richieste</h4>
      <div style="overflow-x: auto;">
        <table class="table" id="tabellaDettaglio">
          <thead>
            <tr>
              <th>Data</th>
              <th>Dipendente</th>
              <th>Tipo</th>
              <th>Periodo</th>
              <th>Stato</th>
              <th>Note</th>
            </tr>
          </thead>
          <tbody>
            <!-- Popolato da JavaScript -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Area nascosta per PDF -->
    <div id="pdfContent" style="display: none;">
      <div style="text-align: center; margin-bottom: 30px;">
        <img id="pdfLogo" src="logo.png" alt="Logo Aziendale" style="max-height: 80px;">
        <h1 style="color: #333; margin-top: 20px;">REPORT PERMESSI DIPENDENTI</h1>
        <p style="color: #666;">Generato il <span id="dataGenerazione"></span></p>
      </div>
      
      <div id="pdfStats" style="margin: 30px 0;">
        <!-- Statistiche per PDF -->
      </div>
      
      <div id="pdfTable" style="margin-top: 30px;">
        <!-- Tabella per PDF -->
      </div>
    </div>
  </div>

  <script src="report_safe.js"></script>
  <script src="pwa-install.js" defer></script>
</body>
</html>
